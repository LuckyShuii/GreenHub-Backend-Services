name: Backend CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

# Une nouvelle poussée sur une PR annule le run précédent encore en cours.
concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: lucasboillot/greenhub
  DEPLOY_SERVICE: backend

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: greener
          POSTGRES_PASSWORD: greener
          POSTGRES_DB: greener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greener -d greener_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: >-
        postgresql+psycopg2://greener:greener@localhost:5432/greener_test
      UV_PYTHON: "3.12"
      CI: "true"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Linter
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Build & push Docker
    runs-on: ubuntu-latest
    needs: quality

    # Publication uniquement après validation de la qualité,
    # sur main ou sur un tag Git.
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )

    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    name: Déclencher le déploiement VPS
    runs-on: ubuntu-latest
    needs: docker

    # Garde-fou supplémentaire : ce job ne tourne jamais sur une PR
    # et uniquement sur main ou un tag.
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )

    permissions: {}

    steps:
      - name: Déclencher le déploiement
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --request POST \
            --header "X-Deploy-Token: ${VPS_DEPLOY_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"version\":\"${GITHUB_SHA}\"}" \
            "https://${DEPLOY_HOST}/hooks/deploy-${DEPLOY_SERVICE}"
