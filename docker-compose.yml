services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: greener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:-greener}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - greener_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: greener-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # reach the DB by service name, overriding the on-host values from .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./backend:/greener
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - greener_internal

volumes:
  pg_data:

networks:
  greener_internal:
    driver: bridge
